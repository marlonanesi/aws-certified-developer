version: 0.0
os: linux
files:
  - source: app.py
    destination: /var/www/app/

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 30
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 30
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 30
      runas: root
